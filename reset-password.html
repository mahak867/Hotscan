<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<meta name="color-scheme" content="dark">
<meta name="description" content="Set a new password for your HotScan account.">
<link rel="canonical" href="https://hotscan.in/reset-password.html">
<title>Reset password · HotScan India</title>
<link rel="icon" type="image/png" href="/favicon.png?v=6">
<script type="module" src="/src/page.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="doc doc-center">
<main class="dialog reset-card">
  <a href="/" class="brand"><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#ff5a1f"/><path d="M8 12.500V10a2 2 0 0 1 2-2h2.500M19.500 8H22a2 2 0 0 1 2 2v2.500M24 19.500V22a2 2 0 0 1-2 2h-2.500M12.500 24H10a2 2 0 0 1-2-2v-2.500" fill="none" stroke="#1b0a02" stroke-width="2.400" stroke-linecap="round"/><circle cx="16" cy="16" r="4.600" fill="none" stroke="#1b0a02" stroke-width="2.400"/><circle cx="16" cy="16" r="1.300" fill="#1b0a02"/></svg><span class="brand-word">Hot<b>Scan</b></span></a>

  <div id="reset-form">
    <h1 class="dialog-t">Set a new password</h1>
    <p class="dialog-m">At least 8 characters.</p>
    <label class="field-label" for="pw1">New password</label>
    <input class="inp" type="password" id="pw1" autocomplete="new-password">
    <label class="field-label" for="pw2">Repeat it</label>
    <input class="inp" type="password" id="pw2" autocomplete="new-password">
    <div class="auth-err-msg" id="form-msg" role="alert"></div>
    <button class="btn btn-primary btn-lg btn-block" id="btn-reset">Update password</button>
  </div>

  <div id="invalid-state" hidden>
    <h1 class="dialog-t">This link has expired</h1>
    <p class="dialog-m">Reset links work once and expire after a short time. Open HotScan, tap Sign In, then “Forgot password?” to get a new one.</p>
    <a class="btn btn-primary btn-lg btn-block" href="/#profile">Open HotScan</a>
  </div>
</main>
<script type="module" src="/src/reset.js"></script>
</body>
</html>
