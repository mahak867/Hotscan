<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HotScan India — Reset Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#1a1916;--ink2:#2e2c28;
  --paper:#faf8f4;--paper2:#f2efe8;--paper3:#e8e4db;
  --red:#c8102e;--muted:#8a8680;--muted2:#b8b4ae;--rule:#dedad2;
  --serif:'Playfair Display',Georgia,serif;
  --sans:'DM Sans',system-ui,sans-serif;
}
html,body{
  height:100%;font-family:var(--sans);
  background:var(--paper);color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;
}
.card{
  background:var(--paper);border:1px solid var(--rule);
  border-radius:16px;padding:48px 40px;width:100%;max-width:420px;
  box-shadow:0 4px 24px rgba(26,25,22,.06);
}
.card-logo{
  display:flex;align-items:center;gap:8px;margin-bottom:32px;
}
.card-logo-dot{width:7px;height:7px;border-radius:50%;background:var(--red)}
.card-logo-txt{
  font-family:var(--serif);font-size:16px;font-weight:700;
  color:var(--ink);letter-spacing:-.02em;
}
.card-title{
  font-family:var(--serif);font-size:28px;font-weight:900;
  color:var(--ink);letter-spacing:-.02em;margin-bottom:8px;
}
.card-sub{font-size:14px;color:var(--muted);margin-bottom:28px;line-height:1.6;font-weight:300}

.form-label{
  display:block;font-size:11px;font-weight:600;
  color:var(--ink2);margin-bottom:7px;letter-spacing:.03em;text-transform:uppercase;
}
.form-input{
  width:100%;background:var(--paper2);
  border:1px solid var(--rule);border-radius:8px;
  padding:12px 14px;font-size:14px;color:var(--ink);
  outline:none;transition:all .15s;font-family:var(--sans);
  margin-bottom:14px;
}
.form-input:focus{border-color:var(--ink2);background:var(--paper);box-shadow:0 0 0 3px rgba(26,25,22,.06)}
.form-input::placeholder{color:var(--muted2)}
.form-submit{
  width:100%;padding:14px;border-radius:8px;
  background:var(--ink);color:var(--paper);
  border:none;font-size:14px;font-weight:600;
  cursor:pointer;letter-spacing:.02em;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:all .2s;font-family:var(--sans);margin-bottom:16px;
}
.form-submit:hover{background:var(--red)}
.form-submit:disabled{opacity:.5;pointer-events:none}
.form-msg{
  font-size:13px;padding:11px 14px;border-radius:7px;
  margin-bottom:16px;display:none;line-height:1.4;
}
.form-msg.show{display:block}
.form-msg.err{background:#fef1f2;border:1px solid #fcd4da;color:#9b1c1c}
.form-msg.ok{background:#f0fdf4;border:1px solid #bbf7d0;color:#14532d}
.back-link{
  text-align:center;font-size:13px;color:var(--muted);
}
.back-link a{
  color:var(--ink);font-weight:600;cursor:pointer;
  text-decoration:underline;
}
.spinner{
  width:14px;height:14px;border-radius:50%;
  border:2px solid rgba(250,248,244,.3);border-top-color:var(--paper);
  animation:spin .6s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none}
</style>
</head>
<body>
<div class="card">
  <div class="card-logo">
    <div class="card-logo-dot"></div>
    <div class="card-logo-txt">HotScan India</div>
  </div>

  <div class="form-msg" id="form-msg"></div>

  <!-- Password reset form -->
  <div id="reset-form">
    <div class="card-title">Set new password</div>
    <div class="card-sub">Choose a strong password for your HotScan account.</div>

    <label class="form-label">New password</label>
    <input class="form-input" type="password" id="pw1" placeholder="Minimum 8 characters" autocomplete="new-password">

    <label class="form-label">Confirm password</label>
    <input class="form-input" type="password" id="pw2" placeholder="Repeat password" autocomplete="new-password">

    <button class="form-submit" id="btn-reset" onclick="doReset()">
      <span id="btn-txt">Update Password</span>
      <div class="spinner" id="btn-spin" style="display:none"></div>
    </button>
    <div class="back-link"><a href="/sign-in.html">← Back to sign in</a></div>
  </div>

  <!-- Invalid link state -->
  <div id="invalid-state" class="hidden">
    <div class="card-title">Link expired</div>
    <div class="card-sub" style="margin-bottom:24px">This password reset link is invalid or has expired. Please request a new one.</div>
    <a href="/sign-in.html" style="display:block">
      <button class="form-submit">Go to Sign In</button>
    </a>
  </div>
</div>

<script>
const SUPA_URL = 'https://qptxrvvpbrnklzpxjtfr.supabase.co'
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFwdHhydnZwYnJua2x6cHhqdGZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3NjA5NjcsImV4cCI6MjA5MDMzNjk2N30.LC0dkwyx8Pt20LKWU7rOR29RO5nwiSOFkTdDT2DfOf0'

const sb = window.supabase.createClient(SUPA_URL, SUPA_KEY)

window.addEventListener('load', function() {
  const hash = window.location.hash
  // Check for valid recovery token
  if (!hash.includes('access_token') && !hash.includes('type=recovery')) {
    document.getElementById('reset-form').classList.add('hidden')
    document.getElementById('invalid-state').classList.remove('hidden')
  }
})

document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doReset()
})

async function doReset() {
  const pw1 = document.getElementById('pw1').value
  const pw2 = document.getElementById('pw2').value

  if (pw1.length < 8) { showMsg('Password must be at least 8 characters', false); return }
  if (pw1 !== pw2) { showMsg('Passwords do not match', false); return }

  setLoading(true)
  clearMsg()

  try {
    const { error } = await sb.auth.updateUser({ password: pw1 })
    if (error) throw error
    showMsg('Password updated successfully! Redirecting to sign in…', true)
    setLoading(false)
    setTimeout(function() { window.location.href = '/sign-in.html' }, 2000)
  } catch(err) {
    setLoading(false)
    showMsg(err.message || 'Could not update password. Please try again.', false)
  }
}

function setLoading(loading) {
  document.getElementById('btn-reset').disabled = loading
  document.getElementById('btn-txt').style.display = loading ? 'none' : 'block'
  document.getElementById('btn-spin').style.display = loading ? 'block' : 'none'
}
function showMsg(txt, ok) {
  const el = document.getElementById('form-msg')
  el.textContent = txt
  el.className = 'form-msg show ' + (ok ? 'ok' : 'err')
}
function clearMsg() {
  document.getElementById('form-msg').className = 'form-msg'
}
</script>
</body>
</html>
